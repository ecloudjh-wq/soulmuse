const state={context:'life',page:'home',font:1,connected:true,viewDate:20,parent:'어머니',selectedMed:1,repeat:'daily',days:[],optional:false,chat:[],listening:false,sharing:{med:true,steps:true,chat:true},meds:[{name:'아침 약',time:'08:00',repeat:'daily',days:[],note:'',drug:'',on:true,response:'taken'},{name:'점심 약',time:'13:00',repeat:'daily',days:[],note:'',drug:'',on:true,response:''},{name:'저녁 약',time:'18:30',repeat:'daily',days:[],note:'',drug:'',on:true,response:''}],familyName:'지연',myName:'사용자',stepConnected:true};
try{state.font=Number(localStorage.getItem('soulmuse-font'))||1}catch(e){}
// Historical fixtures are snapshots, independent of later edits to medication schedules.
const historyToday='2026-10-20';
const historyFixtures={};
for(let day=14;day<=19;day++){
 if(day===15)continue;
 historyFixtures[`2026-10-${day}`]=state.meds.map((m,i)=>({name:m.name,time:m.time,response:['taken','','later'][(day+i)%3]}));
}
state.historyDate=historyToday;state.historyMonth='2026-10';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ic(n,c=''){return `<span aria-hidden="true" class="icon ${c} dir-${n}" style="--src:url('${ASSETS[n]||ASSETS.info}')"></span>`}
function action(a,text,cls='outline',extra=''){return `<button type="button" class="${cls}" data-action="${a}" ${extra}>${text}</button>`}
function timeLabel(t){let [h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`}
function medRepeat(m){return m.repeat==='daily'?'매일':m.days.length?m.days.join('·'):'요일 미설정'}
function back(to='meds'){return action('page:'+to,ic('left','small')+'돌아가기','back')}
function notice(text){return `<div class="notice">${ic('info','small')}<span>${text}</span></div>`}
function render(){
 document.documentElement.dataset.font=String(state.font);
 document.documentElement.style.setProperty('--scale',[1,1.13,1.26][state.font-1]||1);
 $('header').innerHTML=`<div class="brandline"><img class="brand" src="${ASSETS.logo}" alt="소울뮤즈"><span class="tag">예시 화면</span></div><div class="header-controls">${action('context',(state.context==='life'?'내 생활':'가족 리포트')+ic('down','small'),'context','aria-label="화면 전환" aria-haspopup="dialog"')}${action('font','글씨 크기 <b>가</b>','fontquick')}</div>`;
 const views={home:home,meds:medList,medform:medForm,meddetail:medDetail,steps:steps,settings:settings,chat:chat,report:report,family:family,connect:connect,sharing:sharing,history:history};
 $('main').innerHTML=`<section>${(views[state.page]||home)()}</section>`;
 renderFooter();document.title='소울뮤즈 — '+(state.context==='life'?'내 생활':'가족 리포트');
}
function renderFooter(){
 let tabs=state.context==='life'?[['home','home','홈'],['chat','mic','대화'],['meds','pill','약 알림'],['steps','walk','걸음 수'],['settings','gear','설정']]:[['report','report','리포트'],['family','people','가족 관리'],['settings','gear','설정']];
 let current=state.page;if(['medform','meddetail','history'].includes(current))current='meds';if(current==='connect')current='family';if(current==='sharing')current='settings';
 let bar='';
 if(state.context==='life'){
 if(state.page==='medform')bar=`<div class="talk-wrap">${action('savemed','저장하기','primary navy')}</div>`;
 else if(state.page==='chat')bar=`<div class="chat-controls">${action('demochat',state.listening?'말하기 마침':'예시 대화 이어가기','primary')}${action('endchat','대화 끝내기','outline strong')}</div>`;

 }
 $('footer').innerHTML=bar+`<nav class="nav" aria-label="주요 메뉴">${tabs.map(([p,i,t])=>action('page:'+p,ic(i)+`<span>${t}</span>`,p===current?'active':'',p===current?'aria-current="page"':'')).join('')}</nav>`;
}
function companionQuestion(){return '오늘 기분은 어떠세요? 편하게 들려주세요.'}
function companionCard(){
 if(state.companionLater)return `<div class="companion-rest"><span>${ic('mic')}<span><strong>편하실 때 불러 주세요</strong><small>소울뮤즈가 여기 있을게요.</small></span></span>${action('answercompanion','이야기하기','textlink')}</div>`;
 return `<div class="companion-card"><div class="companion-identity"><span class="companion-avatar">${ic('mic')}</span><span><strong>소울뮤즈</strong><small>먼저 건네는 안부</small></span></div><h2>오늘 기분은 어떠세요?</h2><p>편하게 들려주세요.</p>${action('answercompanion',ic('mic')+' 대답하기','primary navy companion-answer')}${action('latercompanion','나중에 이야기하기','companion-later')}</div>`;
}
function home(){
 const weekday=['일','월','화','수','목','금','토'][new Date(historyToday+'T12:00:00').getDay()];
 const scheduled=state.meds.map((m,i)=>({m,i})).filter(({m})=>m.on&&(m.repeat==='daily'||m.days.includes(weekday))).sort((a,b)=>a.m.time.localeCompare(b.m.time));
 const next=scheduled.find(({m})=>m.time>='12:30')||scheduled[0];
 const others=scheduled.filter(item=>item!==next);
 return `<p class="eyebrow">오늘도 함께해요</p><h1 class="greeting companion-greeting">${state.myName==='사용자'?'안녕하세요.':esc(state.myName)+'님, 반가워요.'}</h1>${companionCard()}<div class="sectionhead"><h2>다음 약 알림</h2>${action('page:meds','약 관리 '+ic('right','small'),'textlink')}</div>${next?`<div class="reminder home-reminder"><p class="time">${timeLabel(next.m.time)}</p><h3 class="medicine-name">${esc(next.m.name)}</h3><p class="smalltext">등록한 약과 복용 안내를 확인해요.</p>${action('med:'+next.i,'약 확인하기 '+ic('right','small'),'primary')}${others.length?`<div id="home-other-alerts" ${state.homeAlertsOpen?'':'hidden'}><p class="smalltext home-alert-caption">오늘의 다른 약 알림 · 시간순</p>${others.map(({m,i})=>action('med:'+i,`<span class="home-alert-copy"><strong>${timeLabel(m.time)}</strong><span>${esc(m.name)}</span><small>${m.response==='taken'?'먹었어요 응답':m.response==='later'?'다시 알림 요청':'응답 기록 없음'}</small></span>${ic('right','small')}`,'home-alert-row')).join('')}<p class="smalltext home-alert-caption">본인 응답이며 실제 복용 확인은 아니에요.</p></div>${action('homealerts',`${state.homeAlertsOpen?'접기':'다른 약 알림 보기'} ${ic(state.homeAlertsOpen?'up':'down','small')}`,'home-alert-toggle',`aria-expanded="${!!state.homeAlertsOpen}" aria-controls="home-other-alerts"`)}`:''}</div>`:notice('오늘 예정된 약 알림이 없어요. 약 관리에서 확인해 주세요.')}<button class="walking-strip" data-action="page:steps">${ic('walk')}<div class="walk-group"><p class="smalltext">오늘 걸음</p><strong class="walk-value">${state.stepConnected?'2,350걸음':'사용하기'}</strong></div><span class="walk-detail">걸음 기록 보기</span>${ic('right','small')}</button>`;
}
function medList(){return `<div class="sectionhead"><h1 class="heading">약 알림</h1>${action('newmed',ic('plus','small')+' 약 추가','primary','style="width:auto;font-size:18px;min-height:45px"')}</div><p class="subtitle">등록한 시간에 알려드려요.</p><div class="spacer"></div>${state.meds.map((m,i)=>`<div class="medrow"><button class="medopen" data-action="med:${i}">${ic('pill')}<span><strong class="medlabel">${esc(m.name)}</strong><span class="smalltext">${timeLabel(m.time)} · ${esc(medRepeat(m))}</span></span></button><button class="switch" role="switch" aria-label="${esc(m.name)} 알림" aria-checked="${m.on}" data-action="togglemed:${i}"><span class="switch-track"></span><span>${m.on?'알림 켜짐':'알림 꺼짐'}</span></button></div>`).join('')}<div class="spacer"></div>${action('page:history',ic('clock')+'지난 알림 기록 '+ic('right','small'),'outline')}`}
function medForm(){let m=state.editIndex==null?{name:'',time:'13:00',note:'',drug:''}:state.meds[state.editIndex];return `${back()}<h1 class="heading">약 알림 ${state.editIndex==null?'등록':'수정'}</h1><p class="subtitle">약 봉투의 안내에 맞춰 입력해 주세요.</p><form id="med-form"><label class="field"><span>이름</span><input id="med-name" maxlength="30" value="${esc(m.name)}" placeholder="예: 점심 약" required></label><label class="field"><span>알림 시간</span><input id="med-time" type="time" value="${m.time}" required></label><div class="field"><span>반복</span><div class="segmented">${action('repeat:daily','매일',state.repeat==='daily'?'selected':'')}${action('repeat:days','요일 선택',state.repeat==='days'?'selected':'')}</div><div id="day-picks" class="day-picks ${state.repeat==='daily'?'hidden':''}">${['월','화','수','목','금','토','일'].map(d=>`<label><input type="checkbox" name="day" value="${d}" ${state.days.includes(d)?'checked':''}>${d}</label>`).join('')}</div></div><label class="field"><span>복용 안내 <small class="muted">· 선택</small></span><textarea id="med-note" maxlength="200" placeholder="약 봉투에 적힌 내용">${esc(m.note)}</textarea></label>${action('optional',ic('plus','small')+' 약 이름 추가','outline')}<label class="field ${state.optional||m.drug?'':'hidden'}" id="drug-field"><span>약 이름 · 선택</span><input id="med-drug" value="${esc(m.drug)}" placeholder="등록할 약 이름"></label><p class="tip" style="margin-top:12px">복용 시간과 용량은 처방받은 안내를 확인해 입력해 주세요.</p></form>`}
function medDetail(){let m=state.meds[state.selectedMed];if(!m)return medList();return `${back()}<div class="sectionhead"><h1 class="heading">${esc(m.name)}</h1>${action('editmed','수정','textlink')}</div><div class="group peach time">${timeLabel(m.time)} · ${esc(medRepeat(m))}</div><h2 class="section-title" style="margin-top:25px">등록한 안내</h2><div class="group"><p class="subtitle">${esc(m.note||'별도로 등록한 안내가 없어요.')}</p>${m.drug?`<p class="subtitle">약 이름: ${esc(m.drug)}</p>`:''}${action('editmed',ic('plus','small')+' 안내 추가하기','outline','style="margin-top:14px"')}</div><h2 class="section-title" style="margin-top:25px">오늘 알림</h2><div class="group peach"><p class="smalltext">${m.response==='taken'?'본인이 먹었다고 기록했어요.':m.response==='later'?'나중에 다시 알림을 요청했어요.':'아직 응답하지 않았어요.'}</p><h3 style="font-size:calc(23px * var(--scale));margin:14px 0">등록한 약을 드셨나요?</h3><div class="stack">${action('response:taken','먹었어요','primary')}${action('response:later','나중에 알려줘','outline strong')}</div><p class="smalltext" style="margin-top:12px">본인이 답한 내용으로 기록해요.</p></div>${action('deletemed','이 약 알림 삭제','textlink')}`}
function steps(){
 if(!state.stepConnected)return `<p class="eyebrow">오늘 걸음</p><h1 class="heading">오늘 얼마나<br>걸었는지 함께 볼까요?</h1><div class="steps-welcome"><span class="steps-welcome-icon">${ic('walk')}</span><h2>내 걸음을 한눈에</h2><p class="subtitle">휴대폰에 기록된 걸음 수를<br>소울뮤즈에서 확인할 수 있어요.</p>${action('stepstart','걸음 수 사용하기','primary')}<p class="smalltext">아직 걸음 기록을 가져오지 않았어요.</p></div>${action('page:home','나중에 하기','step-later')}${notice('사용 허용 화면의 예시입니다. 실제 휴대폰 권한은 변경하지 않아요.')}`;
 const vals=[1800,2600,2200,3100,2800,1950,2350], selected=state.stepDay??6;
 const points=vals.map((v,i)=>`${20+i*40},${160-v/4000*160}`).join(' ');
 const lineChart=`<svg class="steps-line-svg" viewBox="0 0 280 160" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="step-line-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f58474" stop-opacity=".2"/><stop offset="100%" stop-color="#f58474" stop-opacity=".015"/></linearGradient></defs><polygon points="20,160 ${points} 260,160" fill="url(#step-line-fill)"/><polyline points="${points}" fill="none" stroke="#e98575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${vals.map((v,i)=>`${i===selected?`<circle cx="${20+i*40}" cy="${160-v/4000*160}" r="10" fill="#f58474" opacity=".17"/>`:''}<circle cx="${20+i*40}" cy="${160-v/4000*160}" r="${i===selected||i===6?5:3.5}" fill="${i===selected||i===6?'#e97868':'#fff'}" stroke="${i===selected||i===6?'#fff':'#e98575'}" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;
 return `<p class="eyebrow">오늘 걸음</p><h1 class="step-total">${state.stepConnected?'2,350<span style="font-size:.62em">걸음</span>':'연결 필요'}</h1><p class="subtitle">${state.stepConnected?'휴대폰에 기록된 걸음 수예요.':'걸음 수 기록을 연결해 주세요.'}</p><p class="smalltext">${state.stepConnected?'마지막 업데이트 오후 12:30':'이 HTML에서는 실제 기기와 연결되지 않아요.'}</p><div class="steps-card"><div class="steps-card-head"><h2 class="section-title">최근 7일</h2><span class="steps-period">10.14 – 10.20</span></div>${state.stepConnected?`<div class="steps-selection" aria-live="polite"><span>${selected===6?'오늘 · ':''}10월 ${14+selected}일</span><p><strong>${vals[selected].toLocaleString()}</strong><span>걸음</span></p></div><div class="steps-graph"><div class="steps-axis" aria-hidden="true"><span>4천</span><span>2천</span><span>0</span></div><div class="steps-plot"><div class="steps-grid" aria-hidden="true"><i></i><i></i><i></i></div>${lineChart}<div class="steps-columns steps-line-columns">${vals.map((v,i)=>action('stepday:'+i,`<span class="steps-line-hit" aria-hidden="true"></span><span class="steps-day-label">${i===6?'오늘':(14+i)+'일'}</span>`,'steps-column '+(i===selected?'is-selected':''),`aria-label="10월 ${14+i}일${i===6?', 오늘':''}, ${v.toLocaleString()}걸음" aria-pressed="${i===selected}"`)).join('')}</div></div></div><p class="steps-hint">날짜를 누르면 걸음 수를 볼 수 있어요.</p>`:`<div class="history-empty" style="margin-top:20px">연결 후 걸음 기록을 확인할 수 있어요.</div>`}<p class="smalltext steps-demo">예시 기록 · 2026년 10월 20일 기준</p></div>${action('stepconnect',`<span>${ic('gear','small')} 걸음 기록 설정</span>${ic('right','small')}`,'step-settings-row')}${notice('휴대폰의 기록을 기준으로 표시해요. 현재는 예시 데이터입니다.')}`;
}
function settings(){return `<h1 class="heading">설정</h1><button class="profile" data-action="profile">${ic('person')}<span style="text-align:left"><strong>내 정보</strong><span class="smalltext" style="display:block">${esc(state.myName)} · 이름과 기본 정보</span></span>${ic('right','small')}</button><h2 class="eyebrow" style="margin-top:17px">편하게 사용하기</h2>${settingRow('font','font','글씨 크기',['크게','더 크게','가장 크게'][state.font-1])}${settingRow('voice','mic','음성 설정','말하기 속도')}${settingRow('notifications','bell','알림 설정','')}<h2 class="eyebrow" style="margin-top:25px">가족과 공유</h2>${settingRow('lifefamily','people','연결된 가족',state.connected?'1명':'없음')}${state.context==='family'?settingRow('lifefamily','report','공유받는 기록',''):settingRow('page:sharing','report','내 기록 공유 범위','')}${settingRow('account','gear','계정 관리','')}`}
function settingRow(a,i,label,value){return action(a,`<span>${ic(i)}${label}</span><span class="sub">${esc(value)} ${ic('right','small')}</span>`,'rowbtn')}
function chat(){return `<p class="eyebrow">소울뮤즈와 이야기</p><h1 class="heading" style="font-size:calc(25px * var(--scale))">편하게 대답해 주세요.</h1><span class="badge">음성 인식·AI 연결 없는 대화 데모</span>${state.chat.map(m=>`<div class="chatbubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}<div class="listening">${ic('mic')}<span>${state.listening?'대답을 기다리고 있어요':'다음 이야기를 기다려요'}</span><p class="smalltext" style="margin-top:7px">실제 녹음은 하지 않습니다.</p></div><label class="field"><span>직접 입력해 보기</span><input id="chat-text" placeholder="오늘 이야기를 입력해 보세요" maxlength="200"></label>${action('sendchat','입력한 이야기 보내기','outline')}`}
function sharedRecordLabels(){return [['med','약 알림 응답'],['steps','걸음 수'],['chat','대화 이용']].filter(([key])=>state.sharing[key]).map(([,label])=>label)}
function report(){
 if(!state.connected)return emptyFamily();
 const day=state.viewDate,today=day===20,week=['일','월','화','수','목','금','토'][new Date(2026,9,day).getDay()];
 const counts=[1,2,1,3,2,1,2],walks=[1800,2600,2200,3100,2800,1950,2350];
 const index=day-14,records=historyRecords(`2026-10-${day}`),labels=sharedRecordLabels();
 return `<h1 class="heading">가족 리포트</h1><p class="subtitle">공유받은 일상을 확인해요.</p>${action('chooseparent',`<span class="report-parent-icon">${ic('person')}</span><span class="report-parent-copy"><strong>${esc(state.parent)}</strong><small>공유받는 기록 ${labels.length}개 항목</small></span>${ic('down','small')}`,'report-parent-picker')}<div class="report-date"><span>${action('date:-1',ic('left','small'),'','aria-label="이전 날짜" '+(day===14?'disabled':''))}</span><div><strong>10월 ${day}일 ${week}요일</strong><small>${today?'오늘 · 오후 1:30 기준':'2026년 · 하루 기록'}</small></div><span>${action('date:1',ic('right','small'),'','aria-label="다음 날짜" '+(today?'disabled':''))}</span></div>${!labels.length?`<div class="history-empty">공유받는 기록이 없어요.<br>공유 항목은 부모님이 직접 선택해요.</div>`:''}${state.sharing.med?`<div class="family-report-card"><div class="family-report-card-head"><h2>${ic('pill','small')} 약 알림 응답</h2><span class="report-neutral-label">본인 응답</span></div>${records.length?records.map(m=>{const planned=today&&m.time>'13:30'&&!m.response;return `<div class="family-med-record"><span><strong>${esc(m.name)}</strong><small>${timeLabel(m.time)}</small></span><span class="report-response ${m.response==='taken'?'responded':''}">${m.response==='taken'?'먹었어요 응답':m.response==='later'?'다시 알림 요청':planned?'알림 예정':'응답 기록 없음'}</span></div>`}).join(''):`<p class="report-no-record">이 날짜에는 알림 기록이 없어요.</p>`}<p class="report-card-note">응답이 없다고 미복용으로 판단하지 않아요.<br>실제 복용 여부를 확인한 정보는 아닙니다.</p></div>`:''}<div class="family-metrics">${state.sharing.steps?`<div class="family-metric"><span>${ic('walk','small')} 걸음 수</span><p><strong>${walks[index].toLocaleString()}</strong><small>걸음</small></p><div>휴대폰 기록 기준</div></div>`:''}${state.sharing.chat?`<div class="family-metric"><span>${ic('mic','small')} 대화 이용</span><p><strong>${counts[index]}</strong><small>회</small></p><div>${today?'마지막 이용 오후 12:10':'선택한 날짜 이용 횟수'}</div></div>`:''}</div><p class="report-privacy">${ic('info','small')} 부모님이 공유한 항목만 보여요.<br>대화 내용 원문은 표시하지 않아요.</p>`;
}
function emptyFamily(showTitle=true){return `${showTitle?'<h1 class="heading">가족 리포트</h1>':''}<div class="empty">${ic('people')}<h2>아직 연결된 가족이 없어요</h2><p class="subtitle">부모님과 연결하면 공유받은 기록을 볼 수 있어요.</p><div class="stack">${action('page:connect','<span>부모님 연결하기</span>'+ic('right','small'),'primary family-connect-centered')}${action('life','내 생활로 돌아가기','outline strong')}</div></div>${notice('연결 후 공유할 항목을 확인해요.')}`}
function family(){return `<div class="sectionhead"><h1 class="heading">가족 관리</h1>${action('page:connect',ic('plus','small')+' 연결','textlink')}</div>${state.connected?`<div class="family-report-card"><div class="family-person"><span class="report-parent-icon">${ic('person')}</span><div><strong>${esc(state.parent)}</strong><small>가족으로 연결되어 있어요</small></div><span class="family-connected-badge">연결됨</span></div><div class="shared-chips">${sharedRecordLabels().map(label=>`<span>${label}</span>`).join('')||'<span>공유 항목 없음</span>'}</div>${action('page:report','리포트 보기 '+ic('right','small'),'primary navy')}${action('disconnect','연결 해제','family-disconnect-link')}</div>${notice('공유할 기록은 부모님이 직접 선택하고 변경할 수 있어요.')}`:emptyFamily(false)}`}

function connect(){return `${back('family')}<h1 class="heading">부모님 연결하기</h1><p class="subtitle">초대를 보내고 부모님과 연결해 보세요.</p><div class="invite-steps"><span><b>1</b>초대 보내기</span><i></i><span><b>2</b>부모님 확인</span><i></i><span><b>3</b>공유 항목 선택</span></div><label class="field"><span>관계</span><select id="parent-relation"><option>어머니</option><option>아버지</option><option>가족</option></select></label><label class="field"><span>부르는 이름</span><input id="parent-name" placeholder="예: 어머니" maxlength="20"></label><div class="bottom-actions">${action('invite','부모님 초대하기','primary')}${action('received','받은 초대 확인하기','outline')}</div>${notice('부모님이 연결을 확인하고 공유할 기록을 직접 선택해요.')}`}

function sharing(){return `${back(state.context==='life'?'settings':'family')}<h1 class="heading">${state.pending?'가족 초대가 도착했어요':'내 기록 공유 범위'}</h1><div class="profile">${ic('person')}<span><strong>딸 · ${esc(state.familyName)}</strong><p class="smalltext">연결할 가족</p></span></div><h2 class="section-title">이 가족에게 어떤 기록을 보여줄까요?</h2>${[['med','약 알림 응답','알림에 답한 기록'],['steps','걸음 수','연결된 기기의 걸음 기록'],['chat','대화 이용 기록','대화 횟수와 이용 시간']].map(([k,t,s])=>`<label class="checkrow"><input type="checkbox" data-share="${k}" ${!state.pending&&state.sharing[k]?'checked':''}><span>${t}<small>${s}</small></span></label>`).join('')}${notice('대화 내용 원문은 공유하지 않아요. 공유 범위는 나중에 설정에서 바꿀 수 있어요.')}<div class="bottom-actions">${action('saveshare',state.pending?'선택한 항목으로 연결하기':'공유 설정 저장','primary navy')}${state.pending?action('decline','지금은 연결하지 않기','outline strong'):''}</div>`}
function dateKey(year,month,day){return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function historyRecords(key){return key===historyToday?state.meds.map(m=>({name:m.name,time:m.time,response:m.response})):historyFixtures[key]||[]}
function history(){
 const [year,monthNumber]=state.historyMonth.split('-').map(Number),month=monthNumber-1;
 const offset=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
 const [sy,sm,sd]=state.historyDate.split('-').map(Number),week=['일','월','화','수','목','금','토'][new Date(sy,sm-1,sd).getDay()];
 const records=historyRecords(state.historyDate).slice().sort((a,b)=>a.time.localeCompare(b.time));
 const selectedLabel=`${sm}월 ${sd}일 ${week}요일`;
 const cells=Array.from({length:offset},()=>'<span aria-hidden="true"></span>');
 for(let d=1;d<=count;d++){
  const key=dateKey(year,month,d),today=key===historyToday,selected=key===state.historyDate,hasRecords=historyRecords(key).length>0;
  cells.push(action('historyday:'+key,`<span>${d}</span><span aria-hidden="true" class="record-dot ${hasRecords?'':'empty'}"></span>`,`calday ${today?'today':''} ${selected?'selected':''}`,`aria-label="${year}년 ${monthNumber}월 ${d}일${today?', 오늘':''}${hasRecords?', 알림 기록 있음':''}${selected?', 선택됨':''}" aria-pressed="${selected}" ${today?'aria-current="date"':''} ${key>historyToday?'disabled':''}`));
 }
 return `<div class="history-pagehead">${action('page:meds',ic('left'),'','aria-label="약 알림으로 돌아가기"')}<h1 class="heading">지난 알림 기록</h1></div><p class="subtitle">날짜를 누르면 아래 기록이 바뀌어요.</p><div class="calendar"><div class="calendar-head">${action('historymonth:-1',ic('left','small'),'','aria-label="이전 달"')}<h2 aria-live="polite">${year}년 ${monthNumber}월</h2>${action('historymonth:1',ic('right','small'),'','aria-label="다음 달" '+(state.historyMonth>=historyToday.slice(0,7)?'disabled':''))}</div><div class="calendar-grid" role="group" aria-label="날짜 선택">${['일','월','화','수','목','금','토'].map(w=>`<span class="weekday">${w}</span>`).join('')}${cells.join('')}</div><p class="calendar-legend"><span class="record-dot" aria-hidden="true"></span>알림 기록이 있는 날 · 테두리는 오늘</p></div><div class="history-datehead"><h2 class="history-title">${selectedLabel}</h2>${action('historytoday','오늘로','today-button')}</div><div id="history-records" aria-live="polite" aria-atomic="true">${records.length?`<p class="smalltext">${records.length}개의 알림 기록 · 예시 데이터</p>${records.map(m=>`<article class="history-event"><h3>${timeLabel(m.time)} · ${esc(m.name)}</h3><p>${m.response==='taken'?"본인이 ‘먹었어요’라고 응답했어요.":m.response==='later'?'나중에 다시 알림을 요청했어요.':'응답 기록이 없어요.'}</p></article>`).join('')}`:`<p class="history-empty">이 날짜에는 알림 기록이 없어요.</p>`}</div>${notice('응답 기록이 없다고 미복용으로 판단하지 않아요. 실제 복용 여부를 확인한 기록은 아닙니다.')}<p class="smalltext">달력과 기록은 2026년 10월 20일을 기준으로 한 시안용 예시입니다.</p>`;
}
function updateHistory(focusAction){const top=$('main').scrollTop;render();$('main').scrollTop=top;if(focusAction){document.querySelector(`[data-action="${focusAction}"]`)?.focus({preventScroll:true})}}
function go(page){closeModal();if(page==='chat'&&!state.chat.length){state.chat=[{role:'ai',text:companionQuestion()}];state.listening=true;}state.page=page;render();$('main').scrollTop=0}
function toast(t){$('toast-root').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>$('toast-root').innerHTML='',3200)}
let modalReturn=null;
function modal(content,cls=''){modalReturn=document.activeElement;$('modal-root').innerHTML=`<div class="overlay ${cls}"><div class="dialog" role="dialog" aria-modal="true" tabindex="-1">${content}</div></div>`;$('main').inert=true;$('footer').inert=true;$('header').inert=true;$('modal-root').querySelector('.dialog').focus()}
function closeModal(){$('modal-root').innerHTML='';$('main').inert=false;$('footer').inert=false;$('header').inert=false;if(modalReturn?.isConnected)modalReturn.focus();modalReturn=null}
function dialogHead(t){return `<div class="dialoghead"><h2>${t}</h2>${action('close','닫기','close')}</div>`}
function showContext(){modal(dialogHead('화면 선택')+[['life','내 생활','대화 · 약 알림 · 걸음 수'],['family','가족 리포트','연결된 가족의 기록 보기']].map(([k,t,s])=>action('context:'+k,`<span><strong>${t}</strong><span class="smalltext">${s}</span></span>${state.context===k?`<span style="color:var(--coral)">${ic('check')}<span class="smalltext">현재 선택</span></span>`:ic('right','small')}`,`context-choice ${state.context===k?'selected':''}`)).join(''),'contextoverlay')}
function showFont(){modal(dialogHead('글씨 크기')+`<p class="subtitle">편하게 읽히는 크기를 골라 주세요.</p>`+['크게','더 크게','가장 크게'].map((s,i)=>action('size:'+(i+1),`<span class="radio"></span><span><strong>${s}</strong><span class="sample" style="font-size:${22+i*4}px">오늘도 함께해요</span></span>`,`size-choice ${state.font===i+1?'selected':''}`)).join('')+action('close','완료','primary navy','style="margin-top:15px"'))}
function startForm(index){state.editIndex=index;let m=index==null?null:state.meds[index];state.repeat=m?.repeat||'daily';state.days=[...(m?.days||[])];state.optional=!!m?.drug;go('medform')}
function saveMed(){let name=$('med-name').value.trim(),time=$('med-time').value;let days=[...document.querySelectorAll('input[name=day]:checked')].map(e=>e.value);if(!name){$('med-name').focus();toast('약 묶음 이름을 입력해 주세요.');return}if(!time){$('med-time').focus();toast('알림 시간을 정해 주세요.');return}if(state.repeat==='days'&&!days.length){toast('알림을 받을 요일을 선택해 주세요.');return}let old=state.editIndex==null?{}:state.meds[state.editIndex];let m={...old,name,time,days,repeat:state.repeat,note:$('med-note').value.trim(),drug:$('med-drug').value.trim(),on:old.on??true,response:old.response||''};if(state.editIndex==null)state.meds.push(m);else state.meds[state.editIndex]=m;state.meds.sort((a,b)=>a.time.localeCompare(b.time));go('meds');toast('약 알림을 저장했어요. 실제 알림은 발송되지 않는 데모예요.')}
function confirmDialog(title,text,a,label='확인'){modal(dialogHead(title)+`<p class="subtitle">${esc(text)}</p><div class="bottom-actions">${action(a,label,'primary navy')}${action('close','취소','outline')}</div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action;let [cmd,arg]=a.split(':');
 if(cmd==='page'){go(arg);return}
 if(cmd==='homealerts'){const y=$('main').scrollTop;state.homeAlertsOpen=!state.homeAlertsOpen;render();$('main').scrollTop=y;document.querySelector('[data-action=homealerts]')?.focus({preventScroll:true});return}
 if(cmd==='close'){closeModal();return}
 if(cmd==='context'){if(!arg){showContext();return}state.context=arg==='life'?'life':'family';go(state.context==='life'?'home':'report');return}
 if(cmd==='life'){state.context='life';go('home');return}
 if(cmd==='font'){showFont();return}
 if(cmd==='size'){state.font=Number(arg);try{localStorage.setItem('soulmuse-font',arg)}catch(e){}render();showFont();return}
 if(cmd==='med'){state.selectedMed=Number(arg);go('meddetail');return}
 if(cmd==='newmed'){startForm(null);return}
 if(cmd==='editmed'){startForm(state.selectedMed);return}
 if(cmd==='savemed'){saveMed();return}
 if(cmd==='repeat'){state.repeat=arg;document.querySelectorAll('.segmented button').forEach(x=>x.classList.toggle('selected',x.dataset.action==='repeat:'+arg));$('day-picks').classList.toggle('hidden',arg==='daily');return}
 if(cmd==='optional'){state.optional=true;$('drug-field').classList.remove('hidden');$('med-drug').focus();return}
 if(cmd==='togglemed'){state.meds[Number(arg)].on=!state.meds[Number(arg)].on;let scroll=$('main').scrollTop;render();$('main').scrollTop=scroll;return}
 if(cmd==='response'){state.meds[state.selectedMed].response=arg;render();toast(arg==='taken'?'본인이 먹었다고 기록했어요.':'다시 알림을 요청한 것으로 기록했어요. 실제 발송은 하지 않아요.');return}
 if(cmd==='deletemed'){confirmDialog('약 알림 삭제','이 약 알림을 예시 목록에서 삭제할까요?','removemed','삭제하기');return}
 if(cmd==='removemed'){state.meds.splice(state.selectedMed,1);go('meds');toast('예시 목록에서 삭제했어요.');return}
 if(cmd==='answercompanion'){state.companionLater=false;go('chat');return}
 if(cmd==='latercompanion'){state.companionLater=true;render();return}
 if(cmd==='talk'){go('chat');return}
 if(cmd==='demochat'){state.chat.push({role:'user',text:'오전에 동네를 조금 걸었어.'},{role:'ai',text:'동네를 걸으셨군요. 어떤 풍경이 보였어요?'});state.listening=false;render();$('main').scrollTop=$('main').scrollHeight;return}
 if(cmd==='sendchat'){let t=$('chat-text').value.trim();if(!t){toast('이야기를 입력해 주세요.');return}state.chat.push({role:'user',text:t},{role:'ai',text:'이야기해 주셔서 고마워요. 지금은 화면을 살펴보는 데모라 정해진 답변을 보여드리고 있어요.'});render();$('main').scrollTop=$('main').scrollHeight;return}
 if(cmd==='endchat'){go('home');return}
 if(cmd==='profile'){modal(dialogHead('내 정보')+`<div class="profile-intro"><span class="profile-avatar">${ic('person')}</span><h3>어떻게 불러드릴까요?</h3><p>편하게 불리고 싶은 이름을 알려 주세요.</p></div><label class="field profile-name-field"><span>이름 또는 호칭</span><input id="profile-name" maxlength="20" value="${esc(state.myName)}" placeholder="예: 영희, 영희 어머니" autocomplete="nickname" aria-describedby="profile-name-help"><small id="profile-name-help">실명 대신 편한 호칭을 입력해도 괜찮아요.</small></label><div class="profile-greeting"><span>호칭 미리보기</span><p id="profile-greeting-text">${esc(state.myName)}님,<br>오늘은 어떤 하루 보내고 계세요?</p></div><div class="profile-actions">${action('close','취소','outline')}${action('saveprofile','저장하기','primary navy')}</div>`);return}
 if(cmd==='saveprofile'){let v=$('profile-name').value.trim();if(!v){toast('이름을 입력해 주세요.');return}state.myName=v;closeModal();render();toast('이름을 저장했어요.');return}
 if(cmd==='voice'){modal(dialogHead('음성 설정')+`<p class="subtitle">AI 말하기 속도</p><label class="field"><span>속도 선택</span><select id="voice-speed"><option>천천히</option><option selected>보통</option><option>빠르게</option></select></label><p class="tip">화면 설정 예시입니다. 실제 음성은 연결되지 않았어요.</p>`+action('savesetting','저장하기','primary navy','style="margin-top:18px"'));return}
 if(cmd==='notifications'){modal(dialogHead('알림 설정')+`<label class="checkrow"><input type="checkbox" checked><span>약 시간 알림<small>등록한 시간의 알림</small></span></label><p class="tip">실제 기기 알림 권한은 요청하지 않습니다.</p>`+action('savesetting','저장하기','primary navy'));return}
 if(cmd==='savesetting'){closeModal();toast('설정 예시를 확인했어요. 실제 기기 설정은 변경하지 않아요.');return}

 if(cmd==='historyday'){if(arg>historyToday)return;state.historyDate=arg;updateHistory(a);return}

});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='med-form')saveMed()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();let dialog=$('modal-root').querySelector('.dialog');if(e.key==='Tab'&&dialog){let els=[...dialog.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);let first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function fitPreview(){const app=$('app');if(window.innerWidth>=600){let s=Math.min(1,(window.innerHeight-24)/844);app.style.width='390px';app.style.height='844px';app.style.margin='12px auto';app.style.transform=`scale(${s})`;app.style.transformOrigin='top center';document.body.style.overflow='hidden'}else{app.style.width='';app.style.height='';app.style.margin='';app.style.transform='';document.body.style.overflow=''}}
window.addEventListener('resize',fitPreview);fitPreview();render();
document.addEventListener('input',event=>{if(event.target.id!=='profile-name')return;const preview=$('profile-greeting-text');if(preview)preview.textContent=(event.target.value.trim()||'입력한 이름')+'님,\n오늘은 어떤 하루 보내고 계세요?';});

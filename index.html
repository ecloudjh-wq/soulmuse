/* Focused life home and family communication; reuse existing typography and colors. */
.n-activities{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 26px}
.n-shortcut{display:flex;align-items:flex-start;text-align:left;gap:9px;border:1px solid var(--line);border-radius:16px;padding:16px 12px;background:white;color:var(--ink);min-height:98px;min-width:0}
.n-shortcut .icon{width:22px;height:22px;flex-shrink:0;margin-top:3px}
.n-shortcut strong{display:block;font-size:calc(18px * var(--scale));line-height:1.4}
.n-shortcut small{display:block;font-size:calc(13px * var(--scale));color:var(--muted);line-height:1.6;margin-top:5px}
.n-medhead{margin-top:0}.n-next-med,.n-news{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:18px 16px;background:white;color:var(--ink);min-height:88px}
.n-med-icon{background:var(--peach);border-radius:12px;padding:10px;display:flex}.n-med-copy{flex:1;min-width:0}.n-med-copy strong{display:block;font-size:calc(21px * var(--scale));line-height:1.4}.n-med-copy small{display:block;color:var(--muted);font-size:calc(15px * var(--scale));line-height:1.6;margin-top:5px;overflow-wrap:anywhere}
.n-med-empty{border:1px solid var(--line);border-radius:18px;padding:18px}.n-med-empty p{color:var(--muted);line-height:1.5}.n-family-person{display:flex;align-items:center;gap:12px;margin:24px 0 30px}.n-family-person>span:nth-child(2){flex:1}.n-family-person strong{display:block;font-size:calc(21px * var(--scale))}.n-family-person small{display:block;color:var(--muted);margin-top:5px}.n-family-person .textlink{font-size:calc(15px * var(--scale))}
[data-page="home"] .companion-card{margin-bottom:0}
[data-page="lifefamily"] .h-card .outline{margin-top:16px;width:100%}
@media(max-width:360px){.n-activities{gap:8px}.n-shortcut{padding:14px 9px;gap:6px}}

.n-family-info-content{display:grid;gap:18px}.n-family-info-content .family-person{margin:0}.n-family-info-content .subtitle{line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}

/* Tablet layout: one navigation system and generous readable controls. */
#app[data-layout="tablet"]{max-width:none;min-height:0;container-type:inline-size;box-shadow:none}
[data-layout="tablet"] .header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px clamp(24px,4vw,48px);border-bottom:1px solid #e8ebef}
[data-layout="tablet"] .brandline{margin:0;gap:20px;justify-content:flex-start;min-width:0}
[data-layout="tablet"] .header-controls{gap:12px;justify-content:flex-end;flex-shrink:0}
[data-layout="tablet"] .brand{width:124px;height:38px}
[data-layout="tablet"] .x-help{min-height:48px;font-size:calc(15px * var(--scale));padding:10px 15px}

[data-layout="tablet"] .main>section{max-width:760px;margin:0 auto}

[data-layout="tablet"] .nav button>.icon{width:29px;height:29px}

[data-layout="tablet"] .footer .nav{border-top:0}
[data-layout="tablet"] .q-footer-actions,[data-layout="tablet"] .v-chat-footer{max-width:760px;margin:0 auto}
[data-layout="tablet"] .dialog{max-width:560px;width:calc(100% - 48px);max-height:calc(100% - 48px)}
[data-layout="tablet"] .v-conversation{max-width:680px;margin:0 auto}
[data-layout="tablet"] .v-presence{width:190px;height:210px;margin:20px auto}
[data-layout="tablet"] .v-caption{font-size:calc(30px * var(--scale))}
[data-layout="tablet"] .n-shortcut small,[data-layout="tablet"] .n-med-copy small{font-size:calc(15px * var(--scale))}
[data-layout="tablet"] .n-med-copy strong{font-size:calc(21px * var(--scale))}

@container (min-width: 760px){
 [data-layout="tablet"][data-page="home"] .n-home-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:start}
 [data-layout="tablet"][data-page="home"] .companion-card{min-height:320px;padding:28px}
 [data-layout="tablet"][data-page="home"] .n-activities{margin:0 0 30px;grid-template-columns:1fr;gap:12px}

}

}
@container (max-width: 700px){

.quiz-support{display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;margin-top:14px}.quiz-support-button{display:inline-flex;align-items:center;gap:7px;min-height:48px;font-size:calc(15px * var(--scale));font-weight:700;color:#566b83}.quiz-exit{margin-top:14px}.quiz-exit .step-later{min-height:48px;color:#747f8d}

.quiz-intro > .quiz-kicker:first-child{margin-top:0}

.checkin-section{margin-top:4px}.checkin-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}.checkin-section-title h2{font-size:calc(19px * var(--scale));font-weight:800}.checkin-section-title span{font-size:calc(14px * var(--scale));color:#6d7888}

.app[data-page="onboarding"] .header{display:none}

.intro-brand-hanja{font-size:.62em;font-weight:650;letter-spacing:0;color:#52677d}

.intro-brand{display:flex;align-items:center;justify-content:center;gap:8px}.dadam-mark-intro{width:96px;height:49px}.intro-brand-hanja{font-size:.62em}

 document.documentElement.style.setProperty('--scale',[1,1.13,1.26][state.font-1]||1);

 const views={home:home,meds:medList,medform:medForm,meddetail:medDetail,steps:steps,settings:settings,chat:extendedChat,report:report,family:family,connect:connect,sharing:sharing,history:history,activities:activities,story:story,quiz:quiz,messages:messages,compose:compose,message:messageDetail,memory:memory,consent:consent,onboarding:onboarding,help:help,health:health,mutual:mutual,checkform:checkForm,checkdetail:checkDetail,bpform:bpForm,bphistory:bpHistory,bpdetail:bpDetail,greeting:greetingSettings,lifefamily:lifeFamily,intro:introScreen};
 $('main').innerHTML=`<section>${(views[state.page]||home)()}</section>`;
 renderFooter();document.title='다담 — '+(state.context==='life'?'내 생활':'가족 리포트');
}
function renderFooter(){
 let tabs=state.context==='life'?[['home','home','홈'],['meds','pill','약 알림'],['health','report','건강 기록'],['lifefamily','people','가족'],['settings','gear','설정']]:[['report','report','리포트'],['family','people','가족 관리'],['settings','gear','설정']];
 let current=state.page;if(['steps','bpform','bpdetail','bphistory'].includes(current))current=state.context==='life'?'health':'report';if(['mutual','checkform','checkdetail'].includes(current))current=state.context==='life'?'lifefamily':'family';if(['medform','meddetail','history'].includes(current))current='meds';if(current==='connect')current='family';if(['activities','story','quiz','onboarding'].includes(current))current='home';if(['messages','compose','message'].includes(current))current=state.context==='family'?'family':'lifefamily';if(['memory','consent','greeting'].includes(current))current='settings';if(current==='sharing')current='settings';
 let bar='';
 if(state.context==='life'){
 if(state.page==='medform')bar=`<div class="talk-wrap">${action('savemed','저장하기','primary navy')}</div>`;
 else if(state.page==='chat')bar=`<div class="chat-controls">${action(state.xChatMode==='listening'?'xchatmode:error':'xchatmode:listening',state.xChatMode==='listening'?'말하기 마침':'말로 대답하기','primary')}${action('endchat','대화 끝내기','outline strong')}</div>`;

 }
 $('footer').innerHTML=bar+`<nav class="nav" aria-label="주요 메뉴">${tabs.map(([p,i,t])=>action('page:'+p,ic(i)+`<span>${t}</span>`,p===current?'active':'',p===current?'aria-current="page"':'')).join('')}</nav>`;
}
function companionQuestion(){return '오늘 기분은 어떠세요? 편하게 들려주세요.'}
function companionCard(){
 if(state.companionLater)return `<div class="companion-rest"><span>${ic('mic')}<span><strong>편하실 때 불러 주세요</strong><small>다담이 여기 있을게요.</small></span></span>${action('answercompanion','이야기하기','textlink')}</div>`;
 return `<div class="companion-card"><div class="companion-identity"><span class="companion-avatar">${ic('mic')}</span><span><strong>다담</strong><small>먼저 건네는 안부</small></span></div><h2>오늘 기분은 어떠세요?</h2><p>편하게 들려주세요.</p>${action('answercompanion',ic('mic')+' 대답하기','primary navy companion-answer')}${action('latercompanion','나중에 이야기하기','companion-later')}</div>`;
}
function home(){
 const weekday=['일','월','화','수','목','금','토'][new Date(historyToday+'T12:00:00').getDay()];
 const scheduled=state.meds.map((m,i)=>({m,i})).filter(({m})=>m.on&&(m.repeat==='daily'||m.days.includes(weekday))).sort((a,b)=>a.m.time.localeCompare(b.m.time));
 const next=scheduled.find(({m})=>m.time>='12:30')||scheduled[0];
 const others=scheduled.filter(item=>item!==next);
 return `<p class="eyebrow">오늘도 함께해요</p><h1 class="greeting companion-greeting">${state.myName==='사용자'?'안녕하세요.':esc(state.myName)+'님, 반가워요.'}</h1>${companionCard()}${!state.xOnboardDone?`<div class="x-hint">${action('page:onboarding','나에게 맞게 시작하기 '+ic('right','small'),'textlink')}</div>`:''}${activitiesHome()}<div class="sectionhead"><h2>다음 약 알림</h2>${action('page:meds','약 관리 '+ic('right','small'),'textlink')}</div>${next?`<div class="reminder home-reminder"><p class="time">${timeLabel(next.m.time)}</p><h3 class="medicine-name">${esc(next.m.name)}</h3><p class="smalltext">등록한 약과 복용 안내를 확인해요.</p>${action('med:'+next.i,'약 확인하기 '+ic('right','small'),'primary')}${others.length?`<div id="home-other-alerts" ${state.homeAlertsOpen?'':'hidden'}><p class="smalltext home-alert-caption">오늘의 다른 약 알림 · 시간순</p>${others.map(({m,i})=>action('med:'+i,`<span class="home-alert-copy"><strong>${timeLabel(m.time)}</strong><span>${esc(m.name)}</span><small>${m.response==='taken'?'먹었어요 응답':m.response==='later'?'다시 알림 요청':m.response==='partial'?'일부 약 먹었어요 응답':'응답 기록 없음'}</small></span>${ic('right','small')}`,'home-alert-row')).join('')}<p class="smalltext home-alert-caption">본인 응답이며 실제 복용 확인은 아니에요.</p></div>${action('homealerts',`${state.homeAlertsOpen?'접기':'다른 약 알림 보기'} ${ic(state.homeAlertsOpen?'up':'down','small')}`,'home-alert-toggle',`aria-expanded="${!!state.homeAlertsOpen}" aria-controls="home-other-alerts"`)}`:''}</div>`:notice('오늘 예정된 약 알림이 없어요. 약 관리에서 확인해 주세요.')}<button class="walking-strip" data-action="page:steps">${ic('walk')}<div class="walk-group"><p class="smalltext">오늘 걸음</p><strong class="walk-value">${state.stepConnected?'2,350걸음':'사용하기'}</strong></div><span class="walk-detail">걸음 기록 보기</span>${ic('right','small')}</button>`;
}
function medList(){return `<div class="sectionhead"><h1 class="heading">약 알림</h1>${action('newmed',ic('plus','small')+' 약 추가','primary','style="width:auto;font-size:18px;min-height:45px"')}</div><p class="subtitle">등록한 시간에 알려드려요.</p><div class="spacer"></div>${state.meds.map((m,i)=>`<div class="medrow"><button class="medopen" data-action="med:${i}">${ic('pill')}<span><strong class="medlabel">${esc(m.name)}</strong><span class="smalltext">${timeLabel(m.time)} · ${esc(medRepeat(m))}</span></span></button><button class="switch" role="switch" aria-label="${esc(m.name)} 알림" aria-checked="${m.on}" data-action="togglemed:${i}"><span class="switch-track"></span><span>${m.on?'알림 켜짐':'알림 꺼짐'}</span></button></div>`).join('')}<div class="spacer"></div>${action('page:history',ic('clock')+'지난 알림 기록 '+ic('right','small'),'outline')}`}
function medForm(){let m=state.editIndex==null?{name:'',time:'13:00',note:'',drug:'',quantity:''}:state.meds[state.editIndex];return `${back()}<h1 class="heading">약 알림 ${state.editIndex==null?'등록':'수정'}</h1><p class="subtitle">약 봉투의 안내에 맞춰 입력해 주세요.</p><form id="med-form"><label class="field"><span>이름</span><input id="med-name" maxlength="30" value="${esc(m.name)}" placeholder="예: 점심 약" required></label><label class="field"><span>알림 시간</span><input id="med-time" type="time" value="${m.time}" required></label><div class="field"><span>반복</span><div class="segmented">${action('repeat:daily','매일',state.repeat==='daily'?'selected':'')}${action('repeat:days','요일 선택',state.repeat==='days'?'selected':'')}</div><div id="day-picks" class="day-picks ${state.repeat==='daily'?'hidden':''}">${['월','화','수','목','금','토','일'].map(d=>`<label><input type="checkbox" name="day" value="${d}" ${state.days.includes(d)?'checked':''}>${d}</label>`).join('')}</div></div><label class="field"><span>복용 안내 <small class="muted">· 선택</small></span><textarea id="med-note" maxlength="200" placeholder="약 봉투에 적힌 내용">${esc(m.note)}</textarea></label>${action('optional',ic('plus','small')+' 약 이름 추가','outline')}<label class="field ${state.optional||m.drug?'':'hidden'}" id="drug-field"><span>약 이름 · 선택</span><input id="med-drug" value="${esc(m.drug)}" placeholder="등록할 약 이름"></label><label class="field"><span>등록한 수량 · 선택</span><input id="med-quantity" maxlength="30" value="${esc(m.quantity||'')}" placeholder="예: 1정 · 약 봉투 안내대로"></label><p class="tip" style="margin-top:12px">복용 시간과 용량은 처방받은 안내를 확인해 입력해 주세요.</p></form>`}
function medDetail(){let m=state.meds[state.selectedMed];if(!m)return medList();return `${back()}<div class="sectionhead"><h1 class="heading">${esc(m.name)}</h1>${action('editmed','수정','textlink')}</div><div class="group peach time">${timeLabel(m.time)} · ${esc(medRepeat(m))}</div><h2 class="section-title" style="margin-top:25px">등록한 안내</h2><div class="group"><p class="subtitle">${esc(m.note||'별도로 등록한 안내가 없어요.')}</p>${m.drug?`<p class="subtitle">약 이름: ${esc(m.drug)}</p>`:''}${m.quantity?`<p class="subtitle">등록한 수량: ${esc(m.quantity)}</p>`:''}${action('editmed',ic('plus','small')+' 안내 추가하기','outline','style="margin-top:14px"')}</div><h2 class="section-title" style="margin-top:25px">오늘 알림</h2><div class="group peach"><p class="smalltext">${m.response==='taken'?'본인이 먹었다고 기록했어요.':m.response==='later'?'나중에 다시 알림을 요청했어요.':m.response==='partial'?'일부 약을 먹었다고 응답했어요.':'아직 응답하지 않았어요.'}</p><h3 style="font-size:calc(23px * var(--scale));margin:14px 0">등록한 약을 드셨나요?</h3><div class="stack">${action('response:taken','먹었어요','primary')}${action('response:later','나중에 알려줘','outline strong')}</div><p class="smalltext" style="margin-top:12px">본인이 답한 내용으로 기록해요.</p></div>${action('deletemed','이 약 알림 삭제','textlink')}`}
function steps(){
 if(!state.stepConnected)return `<p class="eyebrow">오늘 걸음</p><h1 class="heading">오늘 얼마나<br>걸었는지 함께 볼까요?</h1><div class="steps-welcome"><span class="steps-welcome-icon">${ic('walk')}</span><h2>내 걸음을 한눈에</h2><p class="subtitle">휴대폰에 기록된 걸음 수를<br>다담에서 확인할 수 있어요.</p>${action('stepstart','걸음 수 사용하기','primary')}<p class="smalltext">아직 걸음 기록을 가져오지 않았어요.</p></div>${action('page:home','나중에 하기','step-later')}${notice('사용 허용 화면의 예시입니다. 실제 휴대폰 권한은 변경하지 않아요.')}`;
 const vals=[1800,2600,2200,3100,2800,1950,2350], selected=state.stepDay??6;
 const points=vals.map((v,i)=>`${20+i*40},${160-v/4000*160}`).join(' ');
 const lineChart=`<svg class="steps-line-svg" viewBox="0 0 280 160" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="step-line-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f58474" stop-opacity=".2"/><stop offset="100%" stop-color="#f58474" stop-opacity=".015"/></linearGradient></defs><polygon points="20,160 ${points} 260,160" fill="url(#step-line-fill)"/><polyline points="${points}" fill="none" stroke="#e98575" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="steps-points" aria-hidden="true">${vals.map((v,i)=>`<span class="steps-point ${i===selected?'is-selected':''} ${i===6?'is-today':''}" style="left:${(i+.5)/7*100}%;top:${160-v/4000*160}px"></span>`).join('')}</div>`;
 return `<p class="eyebrow">오늘 걸음</p><h1 class="step-total">${state.stepConnected?'2,350<span style="font-size:.62em">걸음</span>':'연결 필요'}</h1><p class="subtitle">${state.stepConnected?'휴대폰에 기록된 걸음 수예요.':'걸음 수 기록을 연결해 주세요.'}</p><p class="smalltext">${state.stepConnected?'마지막 업데이트 오후 12:30':'이 HTML에서는 실제 기기와 연결되지 않아요.'}</p><div class="steps-card"><div class="steps-card-head"><h2 class="section-title">최근 7일</h2><span class="steps-period">10.14 – 10.20</span></div>${state.stepConnected?`<div class="steps-selection" aria-live="polite"><span>${selected===6?'오늘 · ':''}10월 ${14+selected}일</span><p><strong>${vals[selected].toLocaleString()}</strong><span>걸음</span></p></div><div class="steps-graph"><div class="steps-axis" aria-hidden="true"><span>4천</span><span>2천</span><span>0</span></div><div class="steps-plot"><div class="steps-grid" aria-hidden="true"><i></i><i></i><i></i></div>${lineChart}<div class="steps-columns steps-line-columns">${vals.map((v,i)=>action('stepday:'+i,`<span class="steps-line-hit" aria-hidden="true"></span><span class="steps-day-label">${i===6?'오늘':(14+i)+'일'}</span>`,'steps-column '+(i===selected?'is-selected':''),`aria-label="10월 ${14+i}일${i===6?', 오늘':''}, ${v.toLocaleString()}걸음" aria-pressed="${i===selected}"`)).join('')}</div></div></div><p class="steps-hint">날짜를 누르면 걸음 수를 볼 수 있어요.</p>`:`<div class="history-empty" style="margin-top:20px">연결 후 걸음 기록을 확인할 수 있어요.</div>`}<p class="smalltext steps-demo">예시 기록 · 2026년 10월 20일 기준</p></div>${action('stepconnect',`<span>${ic('gear','small')} 걸음 기록 설정</span>${ic('right','small')}`,'step-settings-row')}${notice('걸음 수는 현재 탭에 준비된 기록이에요. 실제 기기 연동은 하지 않아요.')}`;
}
function settings(){return `<h1 class="heading">설정</h1><button class="profile" data-action="profile">${ic('person')}<span style="text-align:left"><strong>내 정보</strong><span class="smalltext" style="display:block">${esc(state.myName)} · 이름과 기본 정보</span></span>${ic('right','small')}</button><h2 class="eyebrow" style="margin-top:17px">편하게 사용하기</h2>${settingRow('font','font','글씨 크기',['크게','더 크게','가장 크게'][state.font-1])}${settingRow('voice','mic','음성 설정','말하기 속도')}${settingRow('notifications','bell','알림 설정','')}<h2 class="eyebrow" style="margin-top:25px">가족과 공유</h2>${settingRow('lifefamily','people','연결된 가족',state.connected?'1명':'없음')}${state.context==='family'?settingRow('lifefamily','report','공유받는 기록',''):settingRow('page:sharing','report','내 기록 공유 범위','')}${settingRow('account','gear','계정 관리','')}`}
function settingRow(a,i,label,value){return action(a,`<span>${ic(i)}${label}</span><span class="sub">${esc(value)} ${ic('right','small')}</span>`,'rowbtn')}
function chat(){return `<p class="eyebrow">다담과 이야기</p><h1 class="heading" style="font-size:calc(25px * var(--scale))">편하게 대답해 주세요.</h1><span class="badge">음성 인식·AI 연결 없는 대화 데모</span>${state.chat.map(m=>`<div class="chatbubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}<div class="listening">${ic('mic')}<span>${state.listening?'대답을 기다리고 있어요':'다음 이야기를 기다려요'}</span><p class="smalltext" style="margin-top:7px">실제 녹음은 하지 않습니다.</p></div><label class="field"><span>직접 입력해 보기</span><input id="chat-text" placeholder="오늘 이야기를 입력해 보세요" maxlength="200"></label>${action('sendchat','입력한 이야기 보내기','outline')}`}
function sharedRecordLabels(){return [['med','약 알림 응답'],['steps','걸음 수'],['chat','대화 이용']].filter(([key])=>state.sharing[key]).map(([,label])=>label)}
function report(){
 if(!state.connected)return emptyFamily();
 const day=state.viewDate,today=day===20,week=['일','월','화','수','목','금','토'][new Date(2026,9,day).getDay()];
 const counts=[1,2,1,3,2,1,2],walks=[1800,2600,2200,3100,2800,1950,2350];
 const index=day-14,records=historyRecords(`2026-10-${day}`),labels=sharedRecordLabels();
 return `<h1 class="heading">가족 리포트</h1><p class="subtitle">공유받은 일상을 확인해요.</p>${action('chooseparent',`<span class="report-parent-icon">${ic('person')}</span><span class="report-parent-copy"><strong>${esc(state.parent)}</strong><small>공유받는 기록 ${labels.length}개 항목</small></span>${ic('down','small')}`,'report-parent-picker')}<div class="report-date"><span>${action('date:-1',ic('left','small'),'','aria-label="이전 날짜" '+(day===14?'disabled':''))}</span><div><strong>10월 ${day}일 ${week}요일</strong><small>${today?'오늘 · 오후 1:30 기준':'2026년 · 하루 기록'}</small></div><span>${action('date:1',ic('right','small'),'','aria-label="다음 날짜" '+(today?'disabled':''))}</span></div>${!labels.length?`<div class="history-empty">공유받는 기록이 없어요.<br>공유 항목은 부모님이 직접 선택해요.</div>`:''}${state.sharing.med?`<div class="family-report-card"><div class="family-report-card-head"><h2>${ic('pill','small')} 약 알림 응답</h2><span class="report-neutral-label">본인 응답</span></div>${records.length?records.map(m=>{const planned=today&&m.time>'13:30'&&!m.response;return `<div class="family-med-record"><span><strong>${esc(m.name)}</strong><small>${timeLabel(m.time)}</small></span><span class="report-response ${m.response==='taken'?'responded':''}">${m.response==='taken'?'먹었어요 응답':m.response==='later'?'다시 알림 요청':planned?'알림 예정':'응답 기록 없음'}</span></div>`}).join(''):`<p class="report-no-record">이 날짜에는 알림 기록이 없어요.</p>`}<p class="report-card-note">응답이 없다고 미복용으로 판단하지 않아요.<br>실제 복용 여부를 확인한 정보는 아닙니다.</p></div>`:''}<div class="family-metrics">${state.sharing.steps?`<div class="family-metric"><span>${ic('walk','small')} 걸음 수</span><p><strong>${walks[index].toLocaleString()}</strong><small>걸음</small></p><div>휴대폰 기록 기준</div></div>`:''}${state.sharing.chat?`<div class="family-metric"><span>${ic('mic','small')} 대화 이용</span><p><strong>${counts[index]}</strong><small>회</small></p><div>${today?'마지막 이용 오후 12:10':'선택한 날짜 이용 횟수'}</div></div>`:''}</div><p class="report-privacy">${ic('info','small')} 부모님이 공유한 항목만 보여요.<br>대화 내용 원문은 표시하지 않아요.</p>`;

function history(){
 const [year,monthNumber]=state.historyMonth.split('-').map(Number),month=monthNumber-1;
 const offset=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
 const [sy,sm,sd]=state.historyDate.split('-').map(Number),week=['일','월','화','수','목','금','토'][new Date(sy,sm-1,sd).getDay()];
 const records=historyRecords(state.historyDate).slice().sort((a,b)=>a.time.localeCompare(b.time));
 const selectedLabel=`${sm}월 ${sd}일 ${week}요일`;
 const cells=Array.from({length:offset},()=>'<span aria-hidden="true"></span>');
 for(let d=1;d<=count;d++){
  const key=dateKey(year,month,d),today=key===historyToday,selected=key===state.historyDate,hasRecords=historyRecords(key).length>0;
  cells.push(action('historyday:'+key,`<span>${d}</span><span aria-hidden="true" class="record-dot ${hasRecords?'':'empty'}"></span>`,`calday ${today?'today':''} ${selected?'selected':''}`,`aria-label="${year}년 ${monthNumber}월 ${d}일${today?', 오늘':''}${hasRecords?', 알림 기록 있음':''}${selected?', 선택됨':''}" aria-pressed="${selected}" ${today?'aria-current="date"':''} ${key>historyToday?'disabled':''}`));
 }
 return `<div class="history-pagehead">${action('page:meds',ic('left'),'','aria-label="약 알림으로 돌아가기"')}<h1 class="heading">지난 알림 기록</h1></div><p class="subtitle">날짜를 누르면 아래 기록이 바뀌어요.</p><div class="calendar"><div class="calendar-head">${action('historymonth:-1',ic('left','small'),'','aria-label="이전 달"')}<h2 aria-live="polite">${year}년 ${monthNumber}월</h2>${action('historymonth:1',ic('right','small'),'','aria-label="다음 달" '+(state.historyMonth>=historyToday.slice(0,7)?'disabled':''))}</div><div class="calendar-grid" role="group" aria-label="날짜 선택">${['일','월','화','수','목','금','토'].map(w=>`<span class="weekday">${w}</span>`).join('')}${cells.join('')}</div><p class="calendar-legend"><span class="record-dot" aria-hidden="true"></span>알림 기록이 있는 날 · 테두리는 오늘</p></div><div class="history-datehead"><h2 class="history-title">${selectedLabel}</h2>${action('historytoday','오늘로','today-button')}</div><div id="history-records" aria-live="polite" aria-atomic="true">${records.length?`<p class="smalltext">${records.length}개의 알림 기록</p>${records.map(m=>`<article class="history-event"><h3>${timeLabel(m.time)} · ${esc(m.name)}</h3><p>${m.response==='taken'?"본인이 ‘먹었어요’라고 응답했어요.":m.response==='later'?'나중에 다시 알림을 요청했어요.':m.response==='partial'?'일부 약을 먹었다고 응답했어요.':state.historyDate===historyToday&&m.time>hNow().slice(11)?'아직 알림 시간이 되지 않았어요.':'응답 기록이 없어요.'}</p></article>`).join('')}`:`<p class="history-empty">이 날짜에는 알림 기록이 없어요.</p>`}</div>${notice('응답 기록이 없다고 미복용으로 판단하지 않아요. 실제 복용 여부를 확인한 기록은 아닙니다.')}<p class="smalltext">기록은 날짜별로 확인할 수 있어요.</p>`;
}

function fitPreview(){
 const app=$('app'),preview=new URLSearchParams(location.search).get('tablet');
 const simulated=preview==='portrait'||preview==='landscape';
 const deviceTablet=window.innerWidth>=600&&window.matchMedia('(pointer: coarse)').matches;
 const tablet=simulated||deviceTablet;
 app.dataset.layout=tablet?'tablet':'phone';
 if(simulated){const w=preview==='landscape'?1024:768,h=preview==='landscape'?768:1024;const scale=Math.min(1,(window.innerWidth-24)/w,(window.innerHeight-24)/h);app.style.width=w+'px';app.style.height=h+'px';app.style.margin='12px auto';app.style.transform=`scale(${scale})`;app.style.transformOrigin='top center';document.body.style.overflow='hidden'}
 else if(deviceTablet){app.style.width='100%';app.style.height='100dvh';app.style.margin='0';app.style.transform='';document.body.style.overflow='hidden'}
 else if(window.innerWidth>=600){const scale=Math.min(1,(window.innerHeight-24)/844);app.style.width='390px';app.style.height='844px';app.style.margin='12px auto';app.style.transform=`scale(${scale})`;app.style.transformOrigin='top center';document.body.style.overflow='hidden'}
 else{app.style.width='';app.style.height='';app.style.margin='';app.style.transform='';document.body.style.overflow=''}
}

function hToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function hTime(value){return new Date(value).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}
function hDate(value){return new Date(value).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}

saveMed=function(){const d=state.vMedDraft;if(!d)return;let error=!d.name.trim()?'묶음 이름을 입력해 주세요.':!d.time?'알림 시간을 골라 주세요.':d.repeat==='days'&&!d.days.length?'반복 요일을 하나 이상 골라 주세요.':d.items.some(i=>!i.name.trim())?'각 약을 구분할 이름이나 별칭을 입력해 주세요.':'';if(error){$('v-med-error').textContent=error;$('v-med-error').scrollIntoView({block:'nearest'});return}const old=state.editIndex==null?{}:state.meds[state.editIndex];const m={...old,...d,vId:old.vId||state.vNextMed++,name:d.name.trim(),on:old.on??true,items:d.items.map(i=>({...i,name:i.name.trim()}))};const n=m.items.filter(i=>i.taken).length;m.response=n===m.items.length?'taken':n?'partial':old.response==='later'?'later':'';m.drug=m.items[0].name;m.note=m.items[0].note;m.quantity=m.items[0].quantity;if(state.editIndex==null)state.meds.push(m);else state.meds[state.editIndex]=m;state.meds.sort((a,b)=>a.time.localeCompare(b.time));state.vMedDirty=false;go('meds');toast('이 탭에 약 묶음을 저장했어요. 실제 알림은 보내지 않아요.')};

function vStopRecord(discard=false){state.vRequest++;clearInterval(state.vRecordTimer);state.vRecordTimer=null;if(discard&&state.vRecorder)state.vRecorder.ondataavailable=null;if(state.vRecorder?.state==='recording'){state.vRecorder.stop()}state.vStream?.getTracks().forEach(t=>t.stop());state.vStream=null;state.vRecordMode='ready'}
async function vRecord(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){state.vRecordError='이 환경에서는 녹음을 지원하지 않아요. 글이나 음성 파일로 답할 수 있어요.';vReplyOpen();return}const request=++state.vRequest;state.vRecordError='';state.vRecordMode='requesting';modal(dialogHead('목소리 답장 준비')+`<p class="subtitle">기기에서 마이크 사용을 허용하면 녹음할 수 있어요.</p>${action('vrecordcancel','취소','outline')}`);try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(request!==state.vRequest){stream.getTracks().forEach(t=>t.stop());return}state.vStream=stream;const recorder=new MediaRecorder(stream),chunks=[];state.vRecorder=recorder;state.vRecordSeconds=0;state.vRecordMode='recording';recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearInterval(state.vRecordTimer);stream.getTracks().forEach(t=>t.stop());state.vStream=null;state.vRecordMode='ready';if(request!==state.vRequest||!chunks.length)return;const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(!blob.size){state.vRecordError='녹음된 소리가 없어요. 다시 녹음해 주세요.'}else state.xReplyFile={name:'목소리 답장',kind:'audio',url:URL.createObjectURL(blob)};vReplyOpen()};recorder.onerror=()=>{vStopRecord(true);state.vRecordError='녹음을 마치지 못했어요. 글이나 파일로 답할 수 있어요.';vReplyOpen()};recorder.start();modal(dialogHead('목소리 답장 녹음 중')+`<div class="v-record-area">${ic('mic','big')}<p class="subtitle">${esc(state.context==='life'?state.familyName:state.parent)}님에게 보낼 답장이에요.</p><strong id="v-record-counter">0초</strong></div><div class="h-actions">${action('vrecordstop','녹음 마치기','primary navy')}${action('vrecordcancel','녹음 취소','outline')}</div><p class="v-note">현재 기기에서만 녹음하고 있어요.</p>`);state.vRecordTimer=setInterval(()=>{state.vRecordSeconds++;if($('v-record-counter'))$('v-record-counter').textContent=state.vRecordSeconds+'초'},1000)}catch(error){if(request!==state.vRequest)return;state.vRecordMode='ready';state.vRecordError=error.name==='NotAllowedError'?'마이크 사용이 허용되지 않았어요. 글이나 음성 파일로 답할 수 있어요.':'마이크를 사용할 수 없어요. 기기의 연결 상태를 확인해 주세요.';vReplyOpen()}}
